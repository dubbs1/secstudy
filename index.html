<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6D4AFF">
<title>AWS CP Study</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="AWS CP Study">
<style>
:root{
  --brand:#6D4AFF;--brand-hover:#7C5CFF;--brand-press:#6243E6;--brand-soft:#F0EDFF;--on-brand:#fff;
  --bg:#F5F4F2;--card:#FFFFFF;--line:#EAE7E4;--field:#F5F4F2;
  --text:#0C0C14;--muted:#5C5958;
  --ok:#1EA885;--ok-soft:#E5F6F0;--bad:#DC3251;--bad-soft:#FCE9ED;--warn:#B85C00;--warn-soft:#FFF1E0;
  --shadow:0 1px 2px rgba(12,12,20,.05),0 6px 20px rgba(12,12,20,.05);
  --r:16px;--r-sm:10px;
}
@media (prefers-color-scheme:dark){:root{
  --brand-soft:#2B2452;--bg:#16141C;--card:#211E29;--line:#34303D;--field:#2A2633;
  --text:#F3F2F7;--muted:#A9A5B4;--ok-soft:#14362D;--bad-soft:#3D1D27;--warn:#FFB35C;--warn-soft:#3A2A16;
  --shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 48px}

/* header */
.top{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px 18px;margin-bottom:14px}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--field);overflow:hidden;margin:12px 0 10px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--field);border-radius:99px;padding:3px 10px;font-size:13px;color:var(--muted)}
.stat b{color:var(--text)}
.stat.timer{background:var(--brand-soft);color:var(--brand)}
@media (prefers-color-scheme:dark){.stat.timer{color:#B9A8FF}}

/* pill segmented nav */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button[aria-selected=true]{background:var(--brand);color:var(--on-brand)}
.seg.small{box-shadow:none;margin:0 0 12px;background:var(--field);border-color:transparent;flex-wrap:wrap}
.seg.small button{font-size:13px;padding:6px 8px;flex:1 1 auto}

/* cards and rows */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:14px 16px}
.row:hover{background:var(--field)}
.row .n{flex:none;width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--field);color:var(--muted)}
.row .n.done{background:var(--ok);color:#fff}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:12.5px}
.row .chev{flex:none;color:var(--muted);transition:transform .2s}
.card.open .row .chev{transform:rotate(90deg)}
.body{padding:2px 16px 16px}
.late{color:var(--bad);font-weight:600}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;margin-right:6px;vertical-align:1px}
.d-cc{background:#E6F0FF;color:#1B5FD1}.d-sec{background:#FCE9ED;color:#B4223F}.d-tech{background:#F0EDFF;color:#5530E0}.d-bill{background:#E5F6F0;color:#127A5F}
@media (prefers-color-scheme:dark){.d-cc{background:#1D2D4A;color:#8DB6FF}.d-sec{background:#3D1D27;color:#FF9AAE}.d-tech{background:#2B2452;color:#B9A8FF}.d-bill{background:#14362D;color:#6FD9B6}}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px;font-weight:700}
ul.pts{margin:0;padding-left:20px}
ul.pts li{margin:4px 0}
.note{background:var(--brand-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:14px;margin:10px 0}
.note.warn{background:var(--warn-soft)}
.muted{color:var(--muted)}

/* checklist */
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;margin:2px -10px}
.check:hover{background:var(--field)}
.check input{appearance:none;flex:none;width:20px;height:20px;border:2px solid var(--line);border-radius:6px;margin:1px 0 0;background:var(--card);display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--brand);border-color:var(--brand)}
.check input:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.check.on span{color:var(--muted);text-decoration:line-through}
.check em{font-style:normal;color:var(--muted);font-size:12.5px;white-space:nowrap}

/* buttons */
.btn{border:0;border-radius:99px;padding:9px 18px;font-weight:600;font-size:14px;background:var(--brand);color:var(--on-brand)}
.btn:hover{background:var(--brand-hover)}.btn:active{background:var(--brand-press)}
.btn.ghost{background:var(--field);color:var(--text)}
.btn.ghost:hover{background:var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:0;font-size:inherit}
@media (prefers-color-scheme:dark){.link{color:#B9A8FF}}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* questions */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.qt{font-weight:600;margin:0 0 10px;font-size:15.5px}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:22px;height:22px;border-radius:99px;background:var(--field);display:grid;place-items:center;font-size:12px;font-weight:700}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.why{display:block;margin-top:4px;font-size:13.5px;color:var(--bad)}
@media (prefers-color-scheme:dark){.why{color:#FF9AAE}}
.fb{border-radius:var(--r-sm);padding:10px 12px;font-size:14px}
.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:99px;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}.dots i.cur{outline:2px solid var(--brand);outline-offset:1px}

/* timer */
.clock{font:700 72px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-align:center;letter-spacing:-.02em;margin:18px 0 6px;font-variant-numeric:tabular-nums}
.ring{height:6px;border-radius:99px;background:var(--field);overflow:hidden;margin:6px 0 16px}
.ring>i{display:block;height:100%;background:var(--brand)}
.field{width:100%;border:1.5px solid var(--line);background:var(--field);border-radius:var(--r-sm);padding:10px 12px}
.field:focus{outline:none;border-color:var(--brand)}
.center{text-align:center}
.foot{margin-top:24px;font-size:13px;color:var(--muted);text-align:center}
.foot .link{font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:9}
.card.review{border:1.5px solid var(--brand)}
.wk{margin:10px 0}
.wk-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13.5px}
.wk-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.wk-row:last-child{border-bottom:0}
table.facts{width:100%;border-collapse:collapse;font-size:14px}
table.facts td{padding:6px 0;border-bottom:1px solid var(--line)}
table.facts td:last-child{text-align:right;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <nav class="seg" role="tablist" id="nav">
    <button role="tab" data-tab="learn">Learn</button>
    <button role="tab" data-tab="practice">Practice</button>
    <button role="tab" data-tab="labs">Labs</button>
    <button role="tab" data-tab="timer">Timer</button>
  </nav>
  <main id="main"></main>
  <div class="foot">
    Progress is saved in this browser only.
    <button class="link" data-act="export">Export</button> ·
    <button class="link" data-act="import">Import</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <span id="installWrap" hidden> · <button class="link" data-act="install">Install app</button></span>
  </div>
</div>

<script>
/* ---------- content ---------- */
const EXAM_DATE = '2026-11-30';
const DOMAINS = {
  cc:   {name:'Cloud Concepts',            short:'Concepts', w:24},
  sec:  {name:'Security & Compliance',     short:'Security', w:30},
  tech: {name:'Cloud Technology & Services', short:'Tech',   w:34},
  bill: {name:'Billing, Pricing & Support', short:'Billing', w:12}
};

const LESSONS = [
 {id:'l1', d:'cc', due:'2026-10-30', t:'Why companies use the cloud',
  steps:['Read the key points below out loud (5 min)','Close this tab and write the six advantages of cloud on paper from memory, then check (5 min)','Answer the 3 questions below (5 min)'],
  pts:['Cloud computing = on-demand IT resources over the internet with pay-as-you-go pricing.',
       'The six advantages AWS lists: <b>trade fixed expense for variable expense</b>, <b>benefit from massive economies of scale</b>, <b>stop guessing capacity</b>, <b>increase speed and agility</b>, <b>stop spending money running data centers</b>, <b>go global in minutes</b>.',
       'CapEx (buy servers up front) becomes OpEx (pay for what you use).',
       '<b>Elasticity</b>: resources grow and shrink with demand automatically. <b>Scalability</b>: the system can handle more load by adding resources.',
       '<b>High availability</b>: stays up when parts fail. <b>Agility</b>: new resources in minutes, so cheap to experiment.']},
 {id:'l2', d:'cc', due:'2026-11-01', t:'Service and deployment models',
  steps:['Read the key points (5 min)','Draw a 3-row table: IaaS / PaaS / SaaS. In each row write one AWS example and who patches the OS (5 min)','Answer the 3 questions (5 min)'],
  pts:['<b>IaaS</b>: you rent raw building blocks and manage the OS and up. Example: Amazon EC2.',
       '<b>PaaS</b>: the provider runs the OS and platform; you bring code. Example: AWS Elastic Beanstalk.',
       '<b>SaaS</b>: a finished application you simply use. Example: web email.',
       'Deployment models: <b>cloud</b> (all in the cloud), <b>hybrid</b> (cloud connected to your data center), <b>on-premises / private cloud</b> (all in your own data center).',
       'The less you manage, the less you control and the less you have to secure yourself.']},
 {id:'l3', d:'cc', due:'2026-11-03', t:'Global infrastructure',
  steps:['Read the key points (5 min)','Open the AWS console (or the public "AWS Global Infrastructure" page) and find how many AZs your nearest Region has (5 min)','Answer the 3 questions (5 min)'],
  pts:['<b>Region</b>: a geographic area, e.g. eu-central-1 (Frankfurt). Fully isolated from other Regions.',
       '<b>Availability Zone (AZ)</b>: one or more discrete data centers with redundant power and networking. Each Region has at least 3.',
       '<b>Edge locations</b>: used by CloudFront and Route 53 to serve users close to them. Far more edge locations than Regions.',
       'Choose a Region by: <b>compliance / data residency</b> first, then <b>latency</b> to users, <b>service availability</b>, and <b>price</b>.',
       'High availability = spread across <b>multiple AZs</b>. Disaster recovery = consider <b>multiple Regions</b>.',
       'Also know: <b>Local Zones</b> (closer to a city), <b>Wavelength</b> (inside 5G networks), <b>Outposts</b> (AWS racks in your own data center).']},
 {id:'l4', d:'cc', due:'2026-11-04', t:'Well-Architected, CAF and migration',
  steps:['Read the key points (5 min)','Make up a silly sentence to remember the 6 pillars (e.g. "Old Sailors Really Prefer Cold Seas") and write it down (5 min)','Answer the 3 questions (5 min)'],
  pts:['<b>Well-Architected Framework, 6 pillars</b>: Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization, Sustainability.',
       '<b>Cloud Adoption Framework (CAF), 6 perspectives</b>: Business, People, Governance (business side) and Platform, Security, Operations (technical side).',
       'People perspective = training, skills, culture, org structure.',
       '<b>Migration strategies (the 7 Rs)</b>: Rehost (lift and shift), Replatform (lift, tinker, shift), Refactor / re-architect, Repurchase (move to SaaS), Retain, Retire, Relocate.',
       'Large offline transfers: the <b>AWS Snow family</b>. Database moves: <b>AWS DMS</b>.']},
 {id:'l5', d:'sec', due:'2026-11-06', t:'The shared responsibility model',
  steps:['Read the key points (5 min)','Write two columns, "AWS" and "Me", and sort these into them: data center guards, guest OS patches, hypervisor, security group rules, IAM users, hardware disposal (5 min)','Answer the 3 questions (5 min)'],
  pts:['<b>AWS: security OF the cloud</b>: facilities, hardware, network, the virtualization layer, and the software that runs managed services.',
       '<b>You: security IN the cloud</b>: your data, IAM, guest OS on EC2, apps, security groups, encryption choices.',
       'The split moves with the service: on <b>EC2</b> you patch the OS; on <b>RDS</b> AWS patches the OS and database engine; on <b>Lambda</b> AWS runs almost everything below your code.',
       '<b>Always yours</b>, whatever the service: your data, who can access it, and how you configure it.',
       'Shared controls: patch management, configuration management, awareness and training (each side for its own part).']},
 {id:'l6', d:'sec', due:'2026-11-08', t:'IAM: who can do what',
  steps:['Read the key points (5 min)','Say out loud the difference between a user, a group, a role and a policy, one sentence each (5 min)','Answer the 3 questions (5 min)'],
  pts:['<b>Root user</b>: the email that created the account. Turn on MFA, don\'t create access keys for it, use it only for the few tasks that need it (e.g. changing support plan, closing the account).',
       '<b>User</b> = a person or app with long-term credentials. <b>Group</b> = a set of users sharing policies. <b>Role</b> = temporary credentials assumed by a service, user or app. <b>Policy</b> = JSON document that allows or denies actions.',
       'Give EC2 or Lambda access to other services with a <b>role</b>, never with keys pasted into code.',
       '<b>Least privilege</b>: grant only what the task needs.',
       '<b>MFA</b> everywhere. <b>IAM Identity Center</b> = single sign-on for people across many accounts.',
       'IAM is global (not per Region) and free.']},
 {id:'l7', d:'sec', due:'2026-11-10', t:'Security services',
  steps:['Read the key points (5 min)','Make 8 flashcards: service name on one side, one-line job on the other. Test yourself twice (8 min)','Answer the 3 questions (5 min)'],
  pts:['<b>GuardDuty</b>: threat detection with ML over CloudTrail, VPC Flow Logs and DNS logs.',
       '<b>Inspector</b>: scans EC2, container images and Lambda for software vulnerabilities.',
       '<b>Macie</b>: finds sensitive data (PII) in S3.',
       '<b>Shield</b>: DDoS protection. Standard is free and automatic; Advanced is paid with a response team.',
       '<b>WAF</b>: web application firewall. Blocks SQL injection, cross-site scripting, bad IPs at layer 7.',
       '<b>Security Hub</b>: one dashboard of security findings. <b>Detective</b>: investigates the root cause of findings.',
       '<b>KMS</b>: encryption keys. <b>Secrets Manager</b>: stores and rotates passwords and API keys. <b>ACM</b>: free TLS certificates.']},
 {id:'l8', d:'sec', due:'2026-11-11', t:'Compliance and governance',
  steps:['Read the key points (5 min)','Write one sentence on the difference between CloudTrail, CloudWatch and Config (5 min)','Answer the 3 questions (5 min)'],
  pts:['<b>AWS Artifact</b>: download AWS\'s compliance reports (SOC, ISO, PCI) and agreements.',
       '<b>CloudTrail</b>: logs every API call: who did what, when, from where. Think "audit".',
       '<b>CloudWatch</b>: metrics, logs and alarms for performance. Think "monitoring".',
       '<b>Config</b>: records resource configuration over time and checks it against rules. Think "is it set up right?"',
       '<b>Organizations</b>: manage many accounts; <b>service control policies (SCPs)</b> set the maximum permissions for accounts in it.',
       '<b>Trusted Advisor</b>: checks for cost, security, performance, fault tolerance and service limits. <b>Audit Manager</b>: collects evidence for audits.']},
 {id:'l9', d:'tech', due:'2026-11-13', t:'Compute',
  steps:['Read the key points (5 min)','Match these to a use case in one line each: EC2, Lambda, Fargate, Elastic Beanstalk, Lightsail (5 min)','Answer the 3 questions (5 min)'],
  pts:['<b>EC2</b>: virtual servers. Families: general purpose, compute optimized, memory optimized, storage optimized, accelerated computing.',
       '<b>Auto Scaling</b>: adds and removes instances to match demand. <b>Elastic Load Balancing</b>: spreads traffic across them.',
       '<b>Lambda</b>: run code without servers, pay per request and duration, up to 15 minutes per run.',
       '<b>ECS / EKS</b>: run containers (EKS = Kubernetes). <b>Fargate</b>: serverless engine for them, no servers to manage. <b>ECR</b>: stores container images.',
       '<b>Elastic Beanstalk</b>: upload code, AWS sets up the servers (PaaS). <b>Lightsail</b>: simple fixed-price servers for small sites.']},
 {id:'l10', d:'tech', due:'2026-11-15', t:'Storage',
  steps:['Read the key points (5 min)','List the S3 storage classes from most expensive to cheapest storage, with one use for each (7 min)','Answer the 3 questions (5 min)'],
  pts:['<b>S3</b>: object storage, virtually unlimited, 99.999999999 % (11 nines) durability. Buckets hold objects.',
       'S3 classes: <b>Standard</b>, <b>Intelligent-Tiering</b> (moves data for you), <b>Standard-IA</b> and <b>One Zone-IA</b> (infrequent access), <b>Glacier Instant / Flexible Retrieval</b>, <b>Glacier Deep Archive</b> (cheapest, retrieval within 12 hours).',
       '<b>EBS</b>: block storage disks for EC2, live in one AZ. <b>Instance store</b>: temporary disk, lost when the instance stops.',
       '<b>EFS</b>: shared Linux file system many instances mount at once. <b>FSx</b>: managed Windows / Lustre file systems.',
       '<b>Storage Gateway</b>: connects on-premises to cloud storage. <b>AWS Backup</b>: central backups.']},
 {id:'l11', d:'tech', due:'2026-11-17', t:'Databases',
  steps:['Read the key points (5 min)','For each, write "relational", "NoSQL", "warehouse" or "cache": RDS, Aurora, DynamoDB, Redshift, ElastiCache (5 min)','Answer the 3 questions (5 min)'],
  pts:['<b>RDS</b>: managed relational databases (MySQL, PostgreSQL, MariaDB, Oracle, SQL Server). AWS does backups, patching, Multi-AZ failover.',
       '<b>Aurora</b>: AWS\'s own MySQL/PostgreSQL-compatible engine, faster and highly available.',
       '<b>DynamoDB</b>: serverless NoSQL key-value, single-digit millisecond latency at any scale.',
       '<b>Redshift</b>: data warehouse for analytics on large data with SQL.',
       '<b>ElastiCache</b>: in-memory cache (Redis / Memcached-compatible). <b>Neptune</b>: graph. <b>DocumentDB</b>: MongoDB-compatible.',
       '<b>DMS</b>: Database Migration Service. Moves databases to AWS with little downtime.']},
 {id:'l12', d:'tech', due:'2026-11-18', t:'Networking and content delivery',
  steps:['Read the key points (5 min)','Draw a VPC box with a public subnet, a private subnet, an internet gateway and a NAT gateway. Label which subnet holds the web server and which the database (8 min)','Answer the 3 questions (5 min)'],
  pts:['<b>VPC</b>: your private network in a Region. <b>Subnets</b> live in one AZ; public subnets route to an <b>internet gateway</b>.',
       '<b>Security group</b>: firewall on the instance, <b>stateful</b>, allow rules only. <b>Network ACL</b>: firewall on the subnet, <b>stateless</b>, allow and deny rules.',
       '<b>NAT gateway</b>: lets private instances reach out to the internet without being reachable.',
       '<b>Route 53</b>: DNS and domain registration. <b>CloudFront</b>: content delivery network using edge locations.',
       '<b>Direct Connect</b>: dedicated private line to AWS. <b>Site-to-Site VPN</b>: encrypted tunnel over the internet.',
       '<b>Global Accelerator</b>: routes users onto the AWS network at the nearest edge for faster, steadier apps.']},
 {id:'l13', d:'tech', due:'2026-11-20', t:'Management, analytics and AI',
  steps:['Read the key points (6 min)','Pick 6 services here and explain each to an imaginary friend in one sentence (6 min)','Answer the 3 questions (5 min)'],
  pts:['<b>CloudFormation</b>: infrastructure as code from templates. <b>Systems Manager</b>: patch and run commands across fleets.',
       '<b>SQS</b>: message queue to decouple parts. <b>SNS</b>: publish/subscribe notifications (email, SMS, other services). <b>EventBridge</b>: event bus.',
       '<b>Athena</b>: SQL straight on files in S3, serverless. <b>Glue</b>: ETL and data catalog. <b>Kinesis</b>: real-time streaming data. <b>QuickSight</b>: dashboards.',
       '<b>Bedrock</b>: use foundation models (generative AI) through an API. <b>SageMaker AI</b>: build, train and deploy your own ML models.',
       '<b>Rekognition</b>: images and video. <b>Comprehend</b>: meaning in text. <b>Polly</b>: text to speech. <b>Transcribe</b>: speech to text. <b>Translate</b>, <b>Lex</b> (chatbots), <b>Amazon Q</b> (AI assistant).']},
 {id:'l14', d:'bill', due:'2026-11-22', t:'Pricing models',
  steps:['Read the key points (5 min)','For each pricing model, write one workload it fits best (5 min)','Answer the 3 questions (5 min)'],
  pts:['<b>On-Demand</b>: pay per second/hour, no commitment. Short, unpredictable work.',
       '<b>Savings Plans</b>: commit to $/hour for 1 or 3 years. <b>Compute Savings Plans</b> apply across instance families, Regions, Fargate and Lambda.',
       '<b>Reserved Instances</b>: commit to a specific instance setup for 1 or 3 years.',
       '<b>Spot Instances</b>: spare capacity up to 90 % off, can be taken back with a 2-minute warning. Only for work that can be interrupted.',

    e.box = Math.min(GAPS.length - 1, Math.max(0, Math.floor(+e.box) || 0));
  }
  if (s.review !== null) {
    const R = s.review;
    const fine = isObj(R) && Array.isArray(R.ids);
    if (fine) R.ids = R.ids.filter(known);
    s.review = fine && Number.isInteger(R.i) && R.i >= 0 && R.i <= R.ids.length ? {ids:R.ids, i:R.i, right:Math.max(0, Math.floor(+R.right) || 0)} : null;
  }
  if (typeof s.pFilter !== 'string') s.pFilter = 'all';
  // Answers given before smart review existed: misses are due now, right answers a week after they were given.
  for (const qid in s.ans) {
    const r = s.ans[qid];
    if (s.srs[qid] || !known(qid)) continue;
    const at = new Date(r.at);
    s.srs[qid] = r.ok ? {box:2, due:addDays(r.at && !isNaN(at) ? isoOf(at) : todayISO(), 7)} : {box:0, due:todayISO()};
  }
  s.v = 2;
  return s;
}

function record(qid, i){

/* ---------- smart review (spaced repetition) ---------- */
// A miss comes back tomorrow; each right answer on a due question waits longer: 1, 3, 7, 14 days.
const GAPS = [1, 3, 7, 14];
const REVIEW_MAX = 10;   // one sitting ≈ 10 minutes
function schedule(qid, ok){
  const t = todayISO(), c = S.srs[qid];
  if (!ok) { S.srs[qid] = {box:0, due:addDays(t, GAPS[0])}; return; }
  if (!c) { S.srs[qid] = {box:2, due:addDays(t, GAPS[2])}; return; }   // right first time
  if (c.due > t) return;   // answered again before it was due: no extra credit
  const box = Math.min(c.box + 1, GAPS.length - 1);
  S.srs[qid] = {box, due:addDays(t, GAPS[box])};
}
const dueNow = () => QUESTIONS.filter(q => S.srs[q.id] && S.srs[q.id].due <= todayISO())
  .sort((a, b) => S.srs[a.id].due.localeCompare(S.srs[b.id].due));
function nextDue(){
  const later = Object.values(S.srs).map(x => x.due).filter(d => d > todayISO()).sort();
  return later.length ? {date:later[0], n:later.filter(d => d === later[0]).length} : null;
}
function reviewCard(){
  const R = S.review, due = dueNow();

    if (!Object.keys(S.srs).length) return '';

        <small>${nx ? `Next: ${nx.n} question${nx.n > 1 ? 's' : ''} on ${fmtDate(nx.date)}` : 'Nothing scheduled'}</small></span></div></div>`;
    }
    const n = Math.min(due.length, REVIEW_MAX);
    return `<div class="card open review"><div class="body" style="padding-top:14px">

  }

      <b>Review done: ${R.right}/${R.ids.length} right</b>

  }
  const q = QUESTIONS.find(x => x.id === R.ids[R.i]), l = LESSONS.find(x => x.id === q.l);

    <div class="qhead"><span>${chip(l.d)}Review ${R.i + 1} of ${R.ids.length}</span><button class="link" data-act="rvClose">Stop</button></div>
    ${qHTML(q, pick, 'r')}
    ${pick != null ? `<div class="btns"><button class="btn" data-act="rvNext">${R.i + 1 < R.ids.length ? 'Next' : 'Finish'}</button></div>` : ''}
    </div></div>`;
}

function domainStats(d){

  const seen = qs.filter(q => S.ans[q.id]);
  return {total:qs.length, seen:seen.length, right:seen.filter(q => S.ans[q.id].ok).length,
          misses:seen.reduce((n, q) => n + (S.ans[q.id].wrong || 0), 0)};
}
function weakLessons(){
  return LESSONS.map(l => {
    const qs = qsFor(l.id);

  }).filter(x => x.misses).sort((a, b) => b.now - a.now || b.misses - a.misses).slice(0, 3);
}
function weakCard(){

    h += `<div class="wk"><div class="wk-top"><span>${chip(d)}${D.w}% of exam</span>

function startTick(){
  clearInterval(tick);
  if (!S.timer.end) return;
  tick = setInterval(() => {
    const ms = timerLeft();
    const c = $('#clock'); if (c) c.textContent = mmss(ms);
    const r = $('#ring'); if (r) r.style.width = (100 - ms / (S.timer.len * 600)) + '%';
    const m = $('#miniClock'); if (m) m.textContent = '⏱ ' + mmss(ms);
    if (ms <= 0) finishTimer();
  }, 250);
}
function finishTimer(){
  clearInterval(tick);
  S.timer.end = null; S.timer.left = null; save();
  beep(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  toast("Time's up");
  render();
}
function beep(){
  try {
    const ctx = audio || new (window.AudioContext || window.webkitAudioContext)(); audio = ctx;
    [0, 0.35, 0.7].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.25);
      o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
    });
  } catch(e) {}
}

/* ---------- render + events ---------- */
function render(){
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  renderTop();
  const views = {learn:renderLearn, practice:renderPractice, labs:renderLabs, timer:renderTimer};
  $('#main').innerHTML = (views[S.tab] || renderLearn)();
  startTick();
}
function scrollToOpen(){
  const el = document.querySelector('.card.open'); if (el) el.scrollIntoView({block:'nearest', behavior:'smooth'});
}

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('#nav button');
  if (tabBtn) { S.tab = tabBtn.dataset.tab; save(); render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return;
  const {act, id} = b.dataset;
  switch (act) {
    case 'toggleFacts': S.open = S.open === 'facts' ? null : 'facts'; S.openLesson = S.open ? '' : null; break;
    case 'toggleFree':  S.open = S.open === 'free' ? null : 'free'; break;
    case 'openLesson':  S.open = null; S.openLesson = S.openLesson === id ? '' : id; break;
    case 'openLab':     S.open = null; S.openLab = S.openLab === id ? null : id; break;
    case 'pick': {
      const i = +b.dataset.i, qid = b.dataset.q, ctx = b.dataset.ctx;
      record(qid, i);
      if (ctx === 'l') live[qid] = i; else live[ctx + ':' + qid] = i;
      if (ctx === 'r' && i === QUESTIONS.find(q => q.id === qid).a) S.review.right++;
      const lid = QUESTIONS.find(q => q.id === qid).l, qs = qsFor(lid);
      if (ctx === 'l' && qs.every(q => S.ans[q.id])) { const st = S.steps[lid] || []; st[LESSONS.find(l => l.id === lid).steps.length - 1] = true; S.steps[lid] = st; }
      break;
    }
    case 'lqNext': lqi[id]++; break;
    case 'lqRetry': delete live[b.dataset.q]; S.ans[b.dataset.q].pick = null; break;
    case 'done': {
      S.done[id] = !S.done[id];
      if (S.done[id]) { const n = nextLesson(); S.openLesson = n ? n.id : ''; toast('Lesson done'); setTimeout(scrollToOpen, 50); }
      break;
    }
    case 'pFilter': S.pFilter = b.dataset.v; pCur = null; break;
    case 'pMode':   S.pMode = b.dataset.v; pCur = null; break;
    case 'pNext': {
      const cur = pCur; delete live['p:' + cur];
      const set = practiceSet(), idx = QUESTIONS.findIndex(q => q.id === cur);
      const after = set.find(q => QUESTIONS.indexOf(q) > idx && q.id !== cur) || set.find(q => q.id !== cur);
      pCur = after ? after.id : null;
      break;
    }
    case 'rvStart': S.review = {ids:dueNow().slice(0, REVIEW_MAX).map(q => q.id), i:0, right:0}; S.open = null;
      S.review.ids.forEach(q => delete live['r:' + q]); window.scrollTo(0, 0); break;
    case 'rvNext':  S.review.i++; break;
    case 'rvClose': S.review = null; S.openLesson = null; break;
    case 'toggleWeak': S.open = S.open === 'weak' ? null : 'weak'; break;
    case 'pLesson': S.pFilter = id; S.pMode = 'all'; S.open = null; pCur = null; break;
    case 'labReset': S.labs[id] = []; break;
    case 'tLen': S.timer = {...S.timer, len:+b.dataset.v, end:null, left:null}; break;
    case 'tGo': {
      try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
      const T = S.timer;
      if (T.end) { T.left = Math.max(0, T.end - Date.now()); T.end = null; }
      else { T.end = Date.now() + (T.left != null ? T.left : T.len * 60000); T.left = null; }
      break;
    }
    case 'tReset': S.timer.end = null; S.timer.left = null; break;
    case 'export': exportProgress(); return;
    case 'import': $('#importFile').click(); return;
    case 'install': if (installPrompt) { installPrompt.prompt(); installPrompt = null; $('#installWrap').hidden = true; } return;
    default: return;
  }
  save(); render();
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'step') {
    const st = S.steps[t.dataset.id] || []; st[+t.dataset.i] = t.checked; S.steps[t.dataset.id] = st;
    save(); render();
  } else if (t.dataset.act === 'labStep') {
    const st = S.labs[t.dataset.id] || []; st[+t.dataset.i] = t.checked; S.labs[t.dataset.id] = st;
    save(); render();
    if (st.filter(Boolean).length === LABS.find(l => l.id === t.dataset.id).steps.length) toast('Lab complete');
  } else if (t.id === 'importFile' && t.files[0]) {
    importProgress(t.files[0]); t.value = '';
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'task') { S.timer.task = e.target.value; save(); }
});

/* ---------- backup ---------- */
function exportProgress(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `aws-study-progress-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importProgress(file){
  const r = new FileReader();
  r.onload = () => {
    let data; try { data = JSON.parse(r.result); } catch(e) { toast('That file isn\'t a progress backup'); return; }
    if (!isObj(data)) { toast('That file isn\'t a progress backup'); return; }
    if (!confirm('Replace the progress in this browser with the one from the file?')) return;
    try { localStorage.setItem(KEY + '_beforeImport', JSON.stringify(S)); localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {}
    S = load(); save(); render(); toast('Progress imported');
  };
  r.readAsText(file);
}

window.addEventListener('visibilitychange', () => { if (!document.hidden && S.timer.end && timerLeft() <= 0) finishTimer(); });
/* ---------- installable app (only when served over https, or localhost for tests) ---------- */
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; $('#installWrap').hidden = false; });
window.addEventListener('appinstalled', () => { $('#installWrap').hidden = true; });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});

S = load();
render();
</script>
</body>
